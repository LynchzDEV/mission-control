<!doctype html>
<html lang="en">
<head>

<title>Terminals · Mission Control sketch</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-width:0;overflow-x:clip}body{background:var(--background);color:var(--text);font:14px var(--ui)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid transparent;background:transparent;padding:7px 10px;border-radius:5px;white-space:nowrap}button:hover{background:var(--raised);color:var(--sky)}button:active{transform:translateY(1px)}:focus-visible{outline:2px solid var(--sky);outline-offset:3px}button[aria-pressed=true]{color:var(--sky);background:var(--raised)}button:disabled{opacity:.5;cursor:default}input,textarea,select{background:var(--background);border:1px solid var(--line);border-radius:5px;padding:10px;min-width:0}textarea{resize:vertical;width:100%;min-height:70px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}h1,h2,h3,p{margin:0}h1{font-size:16px;font-weight:600}h2{font-size:20px}h3{font-size:14px}small,.muted{color:var(--muted)}[hidden]{display:none!important}#atmosphere{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}.outer{max-width:1512px;margin:auto;padding:18px 42px;display:flex;align-items:center;gap:28px}.brand{font-weight:600;letter-spacing:-.4px;font-size:18px}.outer nav{display:flex;gap:5px}.outer .edge{margin-left:auto;display:flex;align-items:center;gap:12px}.sample{font-size:11px;color:var(--muted)}main{margin:126px 42px 40px;max-width:1428px;background:transparent}.workspace-bar{background:var(--background);padding:0 0 10px;display:flex;align-items:center;gap:10px;border-bottom:0}.workspace-bar .tools{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}.body{display:flex;height:550px;min-height:0}.terminal-area{flex:1;min-width:0;display:flex;flex-direction:column}.panes{display:flex;flex:1;min-height:0;min-width:0;padding:10px 0;--ratio:50%}.pane{min-width:0;min-height:0;display:flex;flex-direction:column;flex:1;background:var(--background);border:1px solid var(--line);border-radius:3px;overflow:hidden}.pane:first-child{flex:0 0 calc(var(--ratio) - 5px)}.pane.active{border-color:var(--line)}.pane header{flex-shrink:0;background:var(--surface);border-top:2px solid transparent;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:54px}.pane.active header{border-top-color:var(--sky);color:var(--text)}.pane.active .identity strong{color:var(--sky)}.pane header .identity{flex:1;min-width:90px}.identity strong{display:inline;font-size:13px;margin-right:8px}.identity span{font-size:11px}.activity{font-size:11px;color:var(--mint)}.pane.active header button:hover{background:var(--background);color:var(--text)}.terminal-content{padding:17px 15px;flex:1;overflow:auto;font:13px/1.7 var(--code);overflow-wrap:anywhere}.path{color:var(--muted);font-size:11px;margin-bottom:18px}.output{white-space:pre-wrap;margin:0;font:inherit}.command{flex-shrink:0;padding:10px 12px;border-top:1px solid var(--line)}.command-row{display:flex;gap:6px}.command input{width:100%;font:13px var(--code);border:0;padding:6px 0;border-radius:0}.command label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.command button{color:var(--sky)}.separator{flex:0 0 10px;cursor:col-resize;position:relative;touch-action:none}.separator:after{content:'';position:absolute;left:4px;top:42%;height:35px;width:2px;background:var(--line)}.separator:hover:after,.separator:focus:after{background:var(--sky)}.body:has(.panes.stacked){height:740px}.panes.stacked{flex-direction:column}.stacked .pane:first-child{flex-basis:calc(var(--ratio) - 5px)}.stacked .separator{cursor:row-resize}.stacked .separator:after{top:4px;left:45%;height:2px;width:35px}.panes.single .pane{flex:1!important}.session-bar{border-top:0;padding:6px 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.session-bar button{font-size:12px;border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 12px}.session-bar button[aria-pressed=true]{border-bottom-color:var(--sky);color:var(--text);background:transparent}.session-bar .new{margin-left:auto;color:var(--sky)}.chat{width:300px;flex:0 0 300px;border:1px solid var(--line);border-radius:3px;margin:10px 0 0 14px;display:flex;flex-direction:column;background:var(--surface)}.chat header{padding:14px 18px 15px;display:flex;align-items:center;justify-content:space-between}.chat header small{display:block;margin-top:5px}.messages{padding:4px 18px;overflow:auto;flex:1;line-height:1.65}.message{margin:14px 0 20px;overflow-wrap:anywhere}.message b{display:block;font-size:11px;color:var(--periwinkle);margin-bottom:5px}.message.user{border-left:2px solid var(--sky);padding-left:11px}.progress{color:var(--mint);font-size:12px}details{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;font-size:12px}summary{cursor:pointer;color:var(--muted)}details pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 var(--code)}.composer{padding:10px 18px;border-top:1px solid var(--line)}.composer-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}.primary{background:var(--sky);color:var(--background)}.feedback{color:var(--apricot);font-size:12px;min-height:18px}.bottom{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:0;font-size:11px;color:var(--muted)}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(470px,calc(100% - 32px));padding:24px;max-height:85vh;overflow:auto}dialog::backdrop{background:var(--background);opacity:.65}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.sheet-content{line-height:1.65}.sheet-content ol{padding-left:24px}.sheet-content li{padding:9px 0}.usage-row{padding:16px 0;border-bottom:1px solid var(--line)}.usage-row strong{display:block}.settings-row{margin:16px 0}.settings-row select{width:100%}.empty{color:var(--muted);padding-top:12px}.new-form input{width:100%;margin-bottom:12px}
@media(min-width:1513px){main{margin-left:auto;margin-right:auto}}@media(max-width:1100px){.outer{padding:20px}.outer .sample{display:none}main{margin:125px 20px 40px}.pane header{padding:9px}.body{height:620px}.chat{width:290px;flex-basis:290px}}@media(max-width:800px){.outer{gap:12px;padding:12px;flex-wrap:wrap}.outer .edge{gap:0}.brand{width:100%}main{margin:105px 10px 35px}.workspace-bar{align-items:flex-start;flex-direction:column;padding:12px}.workspace-bar .tools{margin:0}.body,.body:has(.panes.stacked){height:auto;flex-direction:column}.panes{height:640px;flex:none;flex-direction:column}.pane:first-child{flex-basis:calc(var(--ratio) - 5px)}.separator{cursor:row-resize}.separator:after{top:4px;left:45%;height:2px;width:35px}.chat{width:100%;flex:0 0 auto;height:470px;margin:14px 0 0;border:1px solid var(--line)}.bottom{gap:8px;flex-wrap:wrap}.session-bar .new{margin-left:0}.pane header{min-height:54px}.outer nav button{padding:6px 8px}.terminal-content{padding:12px}.path{margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="atmosphere" aria-hidden="true"></canvas>
<header class="outer"><div class="brand">Mission Control <span class="muted">_</span></div><nav aria-label="Workspace"><button data-sheet="Main">Main</button><span aria-current="page" style="color:var(--periwinkle);padding:7px 10px">Terminals</span><button data-sheet="Usage">Usage</button></nav><div class="edge"><span class="sample">Sample preview</span><button data-sheet="Settings">Settings ↗</button></div></header>
<main><div class="workspace-bar"><h1>Terminals</h1><span class="muted" id="session-count">3 sessions</span><div class="tools"><button id="horizontal" aria-pressed="true">Side by side</button><button id="vertical" aria-pressed="false">Stacked</button><button id="split-close">Close split</button><button id="chat-toggle" aria-expanded="false">Agent chat</button></div></div><div class="body"><section class="terminal-area" aria-label="Terminal workspace"><div class="panes" id="panes"></div><nav class="session-bar" id="sessions" aria-label="Terminal sessions"></nav></section><aside class="chat" id="chat" aria-label="Agent conversation"></aside></div><footer class="bottom"><span>Design preview · sample sessions</span><button id="motion-toggle">Pause motion</button></footer></main>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="dialog-head"><h2 id="sheet-title"></h2><button id="sheet-close" aria-label="Close sheet">✕</button></div><div id="sheet-content" class="sheet-content"></div></dialog>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const sessions=[
{id:'layout',name:'Terminal layout',model:'Codex · gpt-6-astra',agent:true,status:'Waiting for you',output:'› Inspect terminal workspace\n\nRead  client/terminal.ts\nRead  client/thread-view.ts\n\n✓ Session lifecycle mapped\n✓ Agent reply states checked\n\nReady to sketch the split workspace.\nWaiting for your direction.',draft:'',command:'',messages:[]},
{id:'review',name:'Review pass',model:'Claude · fable',agent:true,status:'Ready',output:'› Review focus behavior\n\nFocus should keep the other session alive.\nRestore should retain the divider position.\n\nChecklist\n  ✓ independent command buffers\n  ✓ chat follows the active session\n  · inspect narrow viewport\n\nNo production changes.',draft:'',command:'',messages:[]},
{id:'shell',name:'Scratch shell',model:'Shell · local',agent:false,status:'Idle',output:'',draft:'',command:'',messages:[]}
];
let slots=['layout','review'],active=0,orientation='horizontal',ratio=50,focused=null,chatOpen=false,newCount=0,returnFocus=null,userPaused=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),narrow=matchMedia('(max-width: 800px)');
const current=()=>sessions.find(s=>s.id===slots[active]);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function settle(){if(!userPaused&&!reduced.matches)$('panes').animate([{transform:'perspective(1200px) rotateX(.6deg) scale(.994)'},{transform:'perspective(1200px) rotateX(0) scale(1)'}],{duration:240,easing:'ease-out'});}
function activate(index){if(active===index)return;active=index;document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',Number(p.dataset.slot)===active));renderChat();renderSessions();}
function renderPanes(){
const box=$('panes');box.className='panes'+(orientation==='vertical'?' stacked':'')+(focused!==null||slots.length===1?' single':'');box.style.setProperty('--ratio',ratio+'%');box.replaceChildren();
slots.forEach((id,index)=>{
if(focused!==null&&focused!==index)return;
if(index===1&&focused===null){const sep=document.createElement('div');sep.className='separator';sep.id='divider';sep.tabIndex=0;sep.role='separator';sep.setAttribute('aria-label','Resize terminal panes');sep.setAttribute('aria-valuemin','25');sep.setAttribute('aria-valuemax','75');sep.setAttribute('aria-valuenow',ratio);sep.setAttribute('aria-orientation',orientation==='vertical'||narrow.matches?'horizontal':'vertical');box.append(sep);sep.onkeydown=e=>{const vertical=orientation==='vertical'||narrow.matches;const delta=e.key===(vertical?'ArrowDown':'ArrowRight')?5:e.key===(vertical?'ArrowUp':'ArrowLeft')?-5:0;if(delta||e.key==='Home'||e.key==='End'){e.preventDefault();setRatio(e.key==='Home'?25:e.key==='End'?75:ratio+delta);}};sep.onpointerdown=e=>{sep.setPointerCapture(e.pointerId);};sep.onpointermove=e=>{if(!sep.hasPointerCapture(e.pointerId))return;const r=box.getBoundingClientRect();setRatio((orientation==='vertical'||narrow.matches?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width)*100);};sep.onpointerup=e=>{if(sep.hasPointerCapture(e.pointerId))sep.releasePointerCapture(e.pointerId);};}
const s=sessions.find(x=>x.id===id),pane=document.createElement('article');pane.className='pane'+(active===index?' active':'');pane.dataset.slot=index;pane.dataset.session=id;
pane.innerHTML=`<header><div class="identity"><strong>${esc(s.name)}</strong><span>${esc(s.model)}</span></div><span class="activity">${s.status}</span><button class="focus" aria-label="${focused===null?'Focus':'Restore'} ${esc(s.name)}">${focused===null?'⤢ Focus':'↙ Restore'}</button></header><div class="terminal-content"><div class="path">~/kingpinggroup/mission-control</div><pre class="output">${esc(s.output)}</pre><p class="empty" ${s.output?'hidden':''}>No commands yet.<br>Your next thought starts here.</p></div><form class="command"><label for="command-${index}">Terminal command · simulated</label><div class="command-row"><input id="command-${index}" aria-label="Terminal command ${index+1}" autocomplete="off" placeholder="Enter a command" value="${esc(s.command)}"><button aria-label="Run sample command ${index+1}">↵</button></div><div class="feedback" role="status"></div></form>`;
pane.addEventListener('pointerdown',()=>activate(index));pane.addEventListener('focusin',()=>activate(index));pane.querySelector('.focus').onclick=()=>{active=index;focused=focused===null?index:null;render();settle();document.querySelector('.pane.active .focus').focus();};pane.querySelector('input').oninput=e=>s.command=e.target.value;pane.querySelector('form').onsubmit=e=>{e.preventDefault();if(!s.command.trim()){pane.querySelector('.feedback').textContent='Enter a command first.';return;}s.output+=(s.output?'\n\n':'')+'$ '+s.command.trim()+'\nSample only — command was not executed.';s.command='';pane.querySelector('.output').textContent=s.output;pane.querySelector('.empty').hidden=true;pane.querySelector('input').value='';pane.querySelector('.feedback').textContent='Sample command added.';};box.append(pane);
});
if(focused===null&&slots.length===2)setRatio(ratio);
}
function setRatio(value){const vertical=orientation==='vertical'||narrow.matches;const minimum=vertical?Math.min(50,Math.ceil(255/Math.max(1,$('panes').clientHeight-20)*100)):25;ratio=Math.max(minimum,Math.min(100-minimum,value));$('panes').style.setProperty('--ratio',ratio+'%');const divider=$('divider');if(divider){divider.setAttribute('aria-valuenow',String(ratio));divider.setAttribute('aria-valuemin',String(minimum));divider.setAttribute('aria-valuemax',String(100-minimum));}}
function renderSessions(){$('sessions').innerHTML=sessions.map(s=>`<button data-session="${s.id}" aria-pressed="${current().id===s.id}">${esc(s.name)}${slots.includes(s.id)?' ·':''}</button>`).join('')+'<button class="new" id="new-terminal">＋ New terminal</button>';$('sessions').querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{const existing=slots.indexOf(b.dataset.session);if(existing>=0){active=existing;if(focused!==null)focused=existing;}else slots[active]=b.dataset.session;render();$('sessions').querySelector(`[data-session="${current().id}"]`).focus();});$('new-terminal').onclick=()=>openSheet('New terminal');$('session-count').textContent=sessions.length+' sessions';}
function renderChat(){const s=current(),chat=$('chat');chat.hidden=!chatOpen;chat.innerHTML=`<header><div><h3>${s.agent?'Working with '+esc(s.name):'Scratch shell'}</h3><small>${s.agent?esc(s.model):'No associated agent'}</small></div><button id="chat-close" aria-label="Close agent chat">✕</button></header><div class="messages" aria-live="polite">${s.agent?`<div class="progress">✓ Context read · waiting for your reply</div><div class="message"><b>Agent</b>${s.id==='review'?'The focus and restore checks are ready. Which state should I inspect next?':'The terminal pair is ready. I kept the conversation attached to the active session.'}</div><details><summary>Read source · 2 files</summary><pre>client/terminal.ts\n  create · resume · attach session\nclient/thread-view.ts\n  tool result · waiting · reply</pre></details>${s.messages.map(m=>`<div class="message ${m.role}"><b>${m.role==='user'?'You':'Agent · simulated'}</b>${esc(m.text)}</div>`).join('')}`:'<p class="empty">This is a standalone shell.<br>Select Terminal layout or Review pass to continue an agent conversation.</p>'}</div>${s.agent?`<form class="composer"><label for="chat-draft">Reply to ${esc(s.name)}</label><textarea id="chat-draft" placeholder="Give a direction…">${esc(s.draft)}</textarea><div class="feedback" id="chat-feedback" role="status"></div><div class="composer-footer"><small>Simulated reply</small><button class="primary">Send ↗</button></div></form>`:''}`;$('chat-close').onclick=()=>{chatOpen=false;render();$('chat-toggle').focus();};if(s.agent){$('chat-draft').oninput=e=>s.draft=e.target.value;chat.querySelector('form').onsubmit=e=>{e.preventDefault();if(!s.draft.trim()){$('chat-feedback').textContent='Write a message before sending.';return;}s.messages.push({role:'user',text:s.draft.trim()},{role:'agent',text:'Direction received. This preview keeps your reply with this session; no agent was contacted.'});s.draft='';renderChat();$('chat-draft').focus();const messages=chat.querySelector('.messages');messages.scrollTop=messages.scrollHeight;};}}
function render(){renderPanes();renderSessions();renderChat();$('horizontal').setAttribute('aria-pressed',orientation==='horizontal');$('vertical').setAttribute('aria-pressed',orientation==='vertical');$('split-close').textContent=slots.length===1?'Open split':'Close split';$('chat-toggle').textContent=chatOpen?'Hide chat':'Agent chat';$('chat-toggle').setAttribute('aria-expanded',chatOpen);}
for(const direction of ['horizontal','vertical'])$(direction).onclick=()=>{orientation=direction;focused=null;if(slots.length===1)slots.push(sessions.find(s=>s.id!==slots[0]).id);render();settle();};
$('split-close').onclick=()=>{if(slots.length===2){slots=[slots[active]];active=0;}else slots.push(sessions.find(s=>s.id!==slots[0]).id);focused=null;render();settle();};$('chat-toggle').onclick=()=>{chatOpen=!chatOpen;render();settle();};narrow.addEventListener('change',renderPanes);
function openSheet(title){returnFocus=document.activeElement;$('sheet-title').textContent=title;let content='';if(title==='Main')content='<p class="muted">Manual plan · Terminal layout</p><ol><li>Map session and conversation states <span class="progress">✓</span></li><li>Sketch split and focused views <span style="color:var(--apricot)">· in progress</span></li><li>Inspect resize and narrow screens</li><li>Discuss the layout before implementation</li></ol><p class="muted">Steps are a checklist. Nothing runs automatically.</p>';if(title==='Usage')content='<p class="muted">Sample per-engine values</p><div class="usage-row"><strong>Claude</strong>$2.18 · 42,600 tokens<br><small>Window resets at 23:00</small></div><div class="usage-row"><strong>GLM</strong>28% of five-hour quota used<br><small>Monthly quota unavailable</small></div><div class="usage-row"><strong>Codex</strong>Available · authenticated<br><small>Cost and token totals unavailable</small></div><p style="margin-top:18px">Combined total: unavailable</p>';if(title==='Settings')content='<p class="muted">Sample only · selections stay in this open sheet.</p>'+['Plan','Execute','Review'].map((role,i)=>`<div class="settings-row"><label for="role-${role}">${role} engine / model</label><select id="role-${role}"><option ${i===0?'selected':''}>Claude / fable</option><option ${i!==0?'selected':''}>Codex / gpt-6-astra</option></select></div>`).join('')+'<button id="settings-motion"></button><p class="muted">System reduced motion always takes priority.</p>';if(title==='New terminal')content='<form class="new-form"><label for="terminal-name">Terminal name</label><input id="terminal-name" maxlength="36" placeholder="e.g. Layout notes" required><div class="feedback" id="name-feedback" role="status"></div><button class="primary">Create sample terminal</button></form>';$('sheet-content').innerHTML=content;if(title==='Settings'){$('settings-motion').onclick=toggleMotion;syncMotion();}if(title==='New terminal')$('sheet-content').querySelector('form').onsubmit=e=>{e.preventDefault();const name=$('terminal-name').value.trim();if(!name){$('name-feedback').textContent='Enter a terminal name.';return;}const id='new-'+(++newCount);sessions.push({id,name,model:'Shell · local',agent:false,status:'Idle',output:'',draft:'',command:'',messages:[]});slots[active]=id;closeSheet();render();document.querySelector('.pane.active input').focus();};$('sheet').showModal();}
function closeSheet(){$('sheet').close();if(returnFocus?.isConnected)returnFocus.focus();}
document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));$('sheet-close').onclick=closeSheet;$('sheet').addEventListener('cancel',e=>{e.preventDefault();closeSheet();});$('sheet').addEventListener('click',e=>{if(e.target===$('sheet')){const r=$('sheet').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSheet();}});
const canvas=$('atmosphere'),ctx=canvas.getContext('2d',{alpha:false});let width=0,height=0,frame=0,lastTime=0,phase=0;const glyphs=' .,:;+=*#';
function draw(){ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--background');ctx.fillRect(0,0,width,height);ctx.font='12px '+getComputedStyle(document.documentElement).getPropertyValue('--code');ctx.textBaseline='middle';for(let y=0;y<height;y+=13)for(let x=0;x<width;x+=10){const u=x/width,v=(y+55)/Math.min(270,height*.33);const center=.99-.38*u+.12*Math.sin(u*6.4-phase*.38);const distance=(v-center)/(.15+.05*Math.sin(u*4+phase*.22));if(Math.abs(distance)>1.45)continue;const envelope=Math.pow(Math.max(0,1-Math.abs(distance)/1.45),.7);const fold=Math.sin(distance*13+u*9-phase*.65+1.7*Math.sin(u*7+phase*.3));const ridge=Math.pow((fold+1)/2,2),density=envelope*(.16+.84*ridge);if(density<.12)continue;const shade=Math.round(42+density*115);ctx.fillStyle=`rgb(${shade},${shade},${shade+3})`;ctx.fillText(glyphs[Math.min(glyphs.length-1,Math.floor(density*(glyphs.length-1)))],x,y);}}
function sizeCanvas(){const scale=Math.min(1,1600/innerWidth,1100/innerHeight);width=Math.round(innerWidth*scale);height=Math.round(innerHeight*scale);canvas.width=width;canvas.height=height;draw();}
function tick(now){frame=0;if(userPaused||reduced.matches||document.hidden)return;if(!lastTime)lastTime=now;const elapsed=now-lastTime;if(elapsed>=1000/30){phase+=Math.min(elapsed,100)/1000;lastTime=now;draw();}frame=requestAnimationFrame(tick);}
function syncMotion(){cancelAnimationFrame(frame);frame=0;lastTime=0;const paused=userPaused||reduced.matches;document.body.dataset.motion=paused?'paused':'running';$('motion-toggle').textContent=reduced.matches?'Motion off · system preference':userPaused?'Resume motion':'Pause motion';$('motion-toggle').disabled=reduced.matches;if($('settings-motion')){$('settings-motion').textContent=$('motion-toggle').textContent;$('settings-motion').disabled=reduced.matches;}if(paused)document.getAnimations().forEach(a=>a.cancel());else if(!document.hidden)frame=requestAnimationFrame(tick);draw();}
function toggleMotion(){userPaused=!userPaused;syncMotion();}$('motion-toggle').onclick=toggleMotion;reduced.addEventListener('change',syncMotion);document.addEventListener('visibilitychange',syncMotion);window.addEventListener('resize',sizeCanvas);render();sizeCanvas();syncMotion();
})();
</script>
</body>
